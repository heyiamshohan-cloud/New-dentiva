# Dentiva Pro — Windows x64 packaging matrix.
# Artifacts per release: NSIS installer (per-machine, one-click), portable exe,
# plain ZIP, plus blockmap files. The `postdist` script then writes
# SHA256SUMS.txt covering every artifact.
appId: com.dentiva.pro
productName: Dentiva Pro
copyright: Copyright © 2026 Dentiva
directories:
  output: release
  buildResources: build
# No explicit `files:` list — the default keeps the whole app plus ALL
# production dependencies (main bundle loads better-sqlite3/archiver/
# extract-zip/zod externally via electron-vite's externalizeDepsPlugin).
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.ico
  artifactName: "${productName}-${version}-win-x64-${target}.${ext}"
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Dentiva Pro
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: "${productName}-${version}-win-x64-setup.${ext}"
portable:
  artifactName: "${productName}-${version}-win-x64-portable.${ext}"
# zip is a plain target (unknown as a top-level config section — removed);
# its artifact gets the win-level artifactName (${target} → zip).
electronDownload:
  cache: node_modules/.cache/electron
# Native rebuild for the Electron ABI is done explicitly in CI (npm run
# rebuild:native) BEFORE packaging — rebuilding here too would only duplicate
# it and breaks cross-platform dry runs.
npmRebuild: false
publish: null
afterAllArtifactBuild: scripts/postdist.cjs
