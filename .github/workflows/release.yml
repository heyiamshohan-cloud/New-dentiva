name: Release

# Two ways to run:
#   1. Push a version tag:  git tag -a v1.0.0 -m "Dentiva Pro 1.0.0" && git push origin v1.0.0
#      → builds artifacts, verifies them, publishes a GitHub Release.
#   2. Actions → Release → Run workflow (manual)
#      → identical build + verification, artifacts uploaded as a GitHub Actions
#        artifact only — NOTHING is published. Use this as the rehearsal.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # No signing certificates are configured yet — do not hunt for them.
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  windows-release:
    name: Windows x64 artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gates (must all pass before packaging)
        run: |
          npm run typecheck
          npm test
          npm run smoke
          npm run audit:static
          npm run perf
          npm run scale -- 100000 3

      - name: Production bundle
        run: npm run build

      - name: Rebuild better-sqlite3 for the Electron ABI
        run: npm run rebuild:native

      - name: Package NSIS installer + portable + ZIP (+ SHA256SUMS via postdist)
        shell: pwsh
        run: |
          $out = npx electron-builder --win --x64 --publish never 2>&1 | Out-String -Width 400
          $code = $LASTEXITCODE
          $out | Out-File -FilePath release-builder.log -Encoding utf8
          if ($code -ne 0) {
            Write-Host '--- electron-builder log tail ---'
            ($out -split "`n" | Select-Object -Last 120) -join "`n"
            exit 1
          }

      - name: Upload builder log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: builder-log
          path: release-builder.log
          retention-days: 7

      # Debug aid: artifact/log download hosts may be unreachable from some
      # networks, but github.com itself is not — commit the failing log where
      # anyone with repo access can read it (logs/builder-<run_id>.log).
      - name: Publish builder log to the ci-logs branch
        if: failure()
        shell: pwsh
        run: |
          git config user.email actions@github.com
          git config user.name 'github-actions'
          git fetch origin ci-logs
          if ($LASTEXITCODE -eq 0) { git checkout ci-logs } else { git checkout --orphan ci-logs }
          New-Item -ItemType Directory -Force 'logs' | Out-Null
          if (-not (Test-Path 'release-builder.log')) { 'builder log was not captured' | Out-File -FilePath release-builder.log -Encoding utf8 }
          Copy-Item release-builder.log "logs/builder-${{ github.run_id }}.log" -Force -Verbose
          Get-ChildItem logs/ | Format-Table -AutoSize
          git add -f "logs/builder-${{ github.run_id }}.log"
          git status --short
          git commit -m "builder log — run ${{ github.run_id }}"
          git push origin ci-logs

      - name: Verify SHA256SUMS.txt covers every artifact
        shell: pwsh
        run: |
          Push-Location release
          $sums = Get-Content SHA256SUMS.txt
          foreach ($line in $sums) {
            $hash, $name = $line -split '\s+', 2
            $actual = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $hash) { throw "checksum mismatch: $name" }
            Write-Host "OK $name"
          }
          Pop-Location

      - name: Clean-boot verification (portable exe, first run on this machine)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter '*portable*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'portable exe not found in release/' }
          Write-Host "Booting $($exe.Name) (PID watch, GUI-subsystem: no std-handle redirection possible)"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 30
          if ($p.HasExited) { throw "Dentiva Pro exited early (code $($p.ExitCode)) — first-run boot FAILED" }
          $roots = @($env:APPDATA, $exe.Directory.FullName)
          $dataDir = $roots | ForEach-Object { Join-Path $_ 'Dentiva Pro' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dataDir) { Stop-Process -Id $p.Id -Force; throw 'userData directory was not created' }
          Write-Host "OK: alive after 30s, data at $dataDir"
          Get-ChildItem $dataDir -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table
          Stop-Process -Id $p.Id -Force
          Get-Process 'Dentiva Pro' -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: NSIS silent install + uninstall verification
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path release -Filter '*setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'setup.exe not found in release/' }
          Write-Host "Installing $($setup.Name) silently"
          $i = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($i.ExitCode -ne 0) { throw "installer exit code $($i.ExitCode)" }
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\Dentiva Pro'
          $appExe = Join-Path $installRoot 'Dentiva Pro.exe'
          if (-not (Test-Path $appExe)) { throw "app executable missing after install: $appExe" }
          Write-Host "OK: installed to $installRoot"
          $unins = Get-ChildItem $installRoot -Filter '*ninstall*.exe' | Select-Object -First 1
          if (-not $unins) { throw 'uninstaller not found' }
          Write-Host "Uninstalling silently via $($unins.Name)"
          $u = Start-Process -FilePath $unins.FullName -ArgumentList '/S' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exit code $($u.ExitCode)" }
          Start-Sleep -Seconds 10
          if (Test-Path $appExe) { throw 'app executable still present after uninstall' }
          Write-Host 'OK: silent install/uninstall round-trip verified'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dentiva-pro-windows-${{ github.ref_name }}-${{ github.run_attempt }}
          path: release/*
          retention-days: 30

      # Only a final tag (v1.0.0, no prerelease suffix) publishes. Pre-release
      # tags (v1.0.0-rc1 …) and manual runs rehearse everything above.
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create ${{ github.ref_name }} --verify-tag `
            --title "Dentiva Pro ${{ github.ref_name }}" `
            --notes-file docs/RELEASE_NOTES.md `
            release/*
